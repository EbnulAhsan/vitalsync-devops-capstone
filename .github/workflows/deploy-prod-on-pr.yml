name: Deploy Production on PR

on:
  pull_request:
    branches:
      - prod
    types:
      - opened

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  publish-production-images:
    name: Publish ${{ matrix.component }} Production Image
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - component: frontend
            context: frontend
            dockerfile: frontend/Dockerfile.prod

          - component: backend
            context: backend
            dockerfile: backend/Dockerfile.prod

    steps:
      - name: Checkout validated stage source
        uses: actions/checkout@v4
        with:
          ref: stage

      - name: Set lowercase image name
        id: image
        shell: bash
        run: |
          repository_owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${repository_owner}/vitalsync-${{ matrix.component }}" >> "$GITHUB_OUTPUT"

      - name: Set short commit SHA
        id: version
        shell: bash
        run: |
          echo "short_sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish production image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.component == 'frontend' && 'NEXT_PUBLIC_API_URL=http://47.129.153.103:30052/api/v1' || '' }}
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:prod-${{ steps.version.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha }}
            org.opencontainers.image.version=prod-${{ steps.version.outputs.short_sha }}
            dev.vitalsync.environment=production
          cache-from: type=gha
          cache-to: type=gha,mode=max


  update-production-manifests:
    name: Update Production GitOps Manifests
    runs-on: ubuntu-latest
    needs: publish-production-images

    steps:
      - name: Checkout validated stage source
        uses: actions/checkout@v4
        with:
          ref: stage

      - name: Update production image tags
        shell: bash
        run: |
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          sed -i -E "s|ghcr.io/ebnulahsan/vitalsync-frontend:prod-[a-f0-9]+|ghcr.io/ebnulahsan/vitalsync-frontend:prod-${SHORT_SHA}|g" kubernetes/prod/frontend.yaml
          sed -i -E "s|ghcr.io/ebnulahsan/vitalsync-backend:prod-[a-f0-9]+|ghcr.io/ebnulahsan/vitalsync-backend:prod-${SHORT_SHA}|g" kubernetes/prod/backend.yaml

      - name: Commit production manifest update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kubernetes/prod/frontend.yaml kubernetes/prod/backend.yaml

          if git diff --cached --quiet; then
            echo "Production manifests already use this commit version."
            exit 0
          fi

          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          git commit -m "gitops: deploy production images prod-${SHORT_SHA}"
          git push origin HEAD:stage

















