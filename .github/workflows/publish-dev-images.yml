name: Publish Development Images

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  publish-development-images:
    name: Publish ${{ matrix.component }} Development Image
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - component: frontend
            context: frontend
            dockerfile: frontend/Dockerfile.dev

          - component: backend
            context: backend
            dockerfile: backend/Dockerfile.dev

    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Set lowercase image name
        id: image
        shell: bash
        run: |
          repository_owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${repository_owner}/vitalsync-${{ matrix.component }}" >> "$GITHUB_OUTPUT"

      - name: Set short commit SHA
        id: version
        shell: bash
        run: |
          echo "short_sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish development image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:dev-${{ steps.version.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=dev-${{ steps.version.outputs.short_sha }}
            dev.vitalsync.environment=development
          cache-from: type=gha
          cache-to: type=gha,mode=max
