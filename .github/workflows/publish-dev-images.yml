name: Publish Development Images

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  publish-development-images:
    name: Publish ${{ matrix.component }} Development Image
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - component: frontend
            context: frontend
            dockerfile: frontend/Dockerfile.dev

          - component: backend
            context: backend
            dockerfile: backend/Dockerfile.dev

    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Set lowercase image name
        id: image
        shell: bash
        run: |
          repository_owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${repository_owner}/vitalsync-${{ matrix.component }}" >> "$GITHUB_OUTPUT"

      - name: Set short commit SHA
        id: version
        shell: bash
        run: |
          echo "short_sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish development image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:dev-${{ steps.version.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=dev-${{ steps.version.outputs.short_sha }}
            dev.vitalsync.environment=development
          cache-from: type=gha
          cache-to: type=gha,mode=max


  update-development-manifests:
    name: Update Development GitOps Manifests
    runs-on: ubuntu-latest
    needs: publish-development-images

    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Update development image tags
        shell: bash
        run: |
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          sed -i -E "s|ghcr.io/ebnulahsan/vitalsync-frontend:dev-[a-f0-9]+|ghcr.io/ebnulahsan/vitalsync-frontend:dev-${SHORT_SHA}|g" kubernetes/dev/frontend.yaml
          sed -i -E "s|ghcr.io/ebnulahsan/vitalsync-backend:dev-[a-f0-9]+|ghcr.io/ebnulahsan/vitalsync-backend:dev-${SHORT_SHA}|g" kubernetes/dev/backend.yaml

      - name: Commit development manifest update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kubernetes/dev/frontend.yaml kubernetes/dev/backend.yaml

          if git diff --cached --quiet; then
            echo "Development manifests already use this commit version."
            exit 0
          fi

          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          git commit -m "gitops: deploy development images dev-${SHORT_SHA}"
          git push origin HEAD:dev
