name: VitalSync CI

on:
  push:
    branches:
      - dev
      - stage
      - prod
  pull_request:
    branches:
      - dev
      - stage
      - prod

permissions:
  contents: read

jobs:
  frontend-validation:
    name: Frontend Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

  backend-validation:
    name: Backend Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vitalsync

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Run backend lint
        run: npm run lint

      - name: Build backend
        run: npm run build

  docker-build-validation:
    name: Docker Build - ${{ matrix.component }} ${{ matrix.environment }}
    runs-on: ubuntu-latest
    needs:
      - frontend-validation
      - backend-validation

    strategy:
      fail-fast: false
      matrix:
        include:
          - component: frontend
            environment: dev
            context: frontend
            dockerfile: frontend/Dockerfile.dev
            build_args: ""

          - component: frontend
            environment: prod
            context: frontend
            dockerfile: frontend/Dockerfile.prod
            build_args: |
              NEXT_PUBLIC_API_URL=http://localhost:5000/api/v1

          - component: backend
            environment: dev
            context: backend
            dockerfile: backend/Dockerfile.dev
            build_args: ""

          - component: backend
            environment: prod
            context: backend
            dockerfile: backend/Dockerfile.prod
            build_args: |
              DATABASE_URL=postgresql://postgres:postgres@localhost:5432/vitalsync

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker image build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: false
          build-args: ${{ matrix.build_args }}
          tags: vitalsync-${{ matrix.component }}:${{ matrix.environment }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
