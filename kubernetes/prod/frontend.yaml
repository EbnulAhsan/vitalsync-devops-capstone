apiVersion: apps/v1
kind: Deployment
metadata:
  name: vitalsync-frontend
  namespace: vitalsync-prod
  labels:
    app: vitalsync-frontend
    environment: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vitalsync-frontend
      environment: production
  template:
    metadata:
      labels:
        app: vitalsync-frontend
        environment: production
    spec:
      containers:
        - name: frontend
          image: ghcr.io/ebnulahsan/vitalsync-frontend:prod-3507d90
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: NEXT_PUBLIC_API_URL
              value: http://47.129.153.103:30052/api/v1
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vitalsync-frontend
  namespace: vitalsync-prod
  labels:
    app: vitalsync-frontend
    environment: production
spec:
  type: NodePort
  selector:
    app: vitalsync-frontend
    environment: production
  ports:
    - name: http
      port: 3000
      targetPort: http
      nodePort: 30082

















